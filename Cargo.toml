[workspace]
members = [
    "core",
    "tools/cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
argon2 = "0.5"
clap = { version = "4.5", features = ["derive"] }
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.10"
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.37", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
