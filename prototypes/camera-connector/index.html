<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Connector 当前产品原型</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #031714;
      --page-2: #061f1b;
      --phone: #001719;
      --panel: #061f2b;
      --panel-2: #0b2633;
      --control: #122833;
      --line: #244454;
      --line-strong: #0fd2ef;
      --ink: #edf7fb;
      --muted: #93acb8;
      --soft: #5e7b88;
      --cyan: #08d4f6;
      --cyan-2: #00a8c7;
      --green: #25e0a3;
      --yellow: #f6d400;
      --red: #ff4777;
      --purple: #9a65ff;
      --orange: #ff9f3f;
      --shadow: rgba(0, 0, 0, 0.34);
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 20% 12%, rgba(8, 212, 246, 0.14), transparent 32%),
        radial-gradient(circle at 84% 78%, rgba(37, 224, 163, 0.10), transparent 30%),
        linear-gradient(140deg, var(--page), var(--page-2));
      color: var(--ink);
      letter-spacing: 0;
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(390px, 430px) minmax(280px, 360px);
      gap: 26px;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .brief,
    .shot-panel {
      align-self: stretch;
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 20px;
      border: 1px solid rgba(8, 212, 246, 0.18);
      background: rgba(2, 18, 24, 0.72);
      border-radius: 18px;
    }

    .brief h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.16;
      font-weight: 850;
    }

    .brief p,
    .shot-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }

    .route-group {
      margin-top: 18px;
    }

    .route-title {
      margin-bottom: 8px;
      color: var(--soft);
      font-size: 12px;
      font-weight: 800;
    }

    .route-list {
      display: grid;
      gap: 8px;
    }

    .route {
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 46px;
      padding: 8px 10px;
      color: var(--ink);
      background: rgba(11, 38, 51, 0.65);
      border: 1px solid rgba(36, 68, 84, 0.9);
      border-radius: 12px;
      text-align: left;
    }

    .route.active {
      border-color: rgba(8, 212, 246, 0.86);
      background: rgba(8, 212, 246, 0.13);
    }

    .route-icon,
    .mini-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      color: var(--cyan);
      background: rgba(8, 212, 246, 0.12);
      font-weight: 850;
    }

    .route strong {
      display: block;
      font-size: 14px;
      line-height: 1.2;
    }

    .route small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .phone {
      width: 393px;
      height: 852px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      background: var(--phone);
      border: 1px solid rgba(8, 212, 246, 0.25);
      box-shadow: 0 22px 58px var(--shadow);
    }

    .statusbar {
      height: 42px;
      padding: 14px 22px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 760;
      color: var(--ink);
    }

    .camera-hole {
      position: absolute;
      top: 12px;
      left: 50%;
      width: 26px;
      height: 26px;
      margin-left: -13px;
      border-radius: 50%;
      background: #000;
      z-index: 5;
    }

    .app {
      position: absolute;
      inset: 42px 0 0;
      padding-bottom: 78px;
      overflow: hidden;
    }

    .screen {
      height: 100%;
      overflow: auto;
      padding: 16px 14px 22px;
      scrollbar-width: none;
    }

    .screen::-webkit-scrollbar,
    .brief::-webkit-scrollbar,
    .shot-panel::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 76px;
      background: #041f2c;
      border-top: 1px solid rgba(36, 68, 84, 0.9);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      padding: 0 34px 8px;
      z-index: 20;
    }

    .bottom-nav::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -20px;
      width: 118px;
      height: 40px;
      margin-left: -59px;
      background: var(--phone);
      border-bottom-left-radius: 60px 36px;
      border-bottom-right-radius: 60px 36px;
      border: 1px solid rgba(36, 68, 84, 0.9);
      border-top: 0;
    }

    .nav-btn {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin: 0 auto;
      color: #8eabba;
      background: transparent;
      border-radius: 50%;
    }

    .nav-btn.active {
      width: 58px;
      height: 58px;
      margin-top: -28px;
      color: #001b22;
      background: var(--cyan);
    }

    .nav-btn svg,
    .back-btn svg,
    .icon-btn svg,
    .action-round svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      margin-bottom: 10px;
    }

    .page-header.compact {
      min-height: 44px;
      margin-bottom: 4px;
    }

    .back-btn,
    .icon-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--cyan);
      background: transparent;
    }

    .title-stack h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 820;
    }

    .title-stack p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      border: 1px solid var(--line);
      background: rgba(6, 31, 43, 0.88);
      border-radius: var(--radius);
    }

    .card-pad {
      padding: 14px;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row.between {
      justify-content: space-between;
    }

    .muted {
      color: var(--muted);
    }

    .tiny {
      font-size: 12px;
    }

    .label {
      font-size: 12px;
      color: var(--muted);
    }

    .value {
      font-weight: 800;
    }

    .pill,
    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 5px 11px;
      border-radius: 999px;
      color: var(--ink);
      border: 1px solid var(--line);
      background: var(--control);
      font-size: 12px;
      font-weight: 760;
      white-space: nowrap;
    }

    .chip.active,
    .pill.primary {
      color: #001b22;
      background: var(--cyan);
      border-color: var(--cyan);
    }

    .pill.green {
      color: var(--green);
      border-color: rgba(37, 224, 163, 0.5);
      background: rgba(37, 224, 163, 0.08);
    }

    .pill.red {
      color: var(--red);
      border-color: rgba(255, 71, 119, 0.55);
      background: rgba(255, 71, 119, 0.1);
    }

    .pill.yellow {
      color: var(--yellow);
      border-color: rgba(246, 212, 0, 0.55);
      background: rgba(246, 212, 0, 0.08);
    }

    .pill.purple {
      color: var(--purple);
      border-color: rgba(154, 101, 255, 0.55);
      background: rgba(154, 101, 255, 0.1);
    }

    .button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 14px;
      color: #001b22;
      background: var(--cyan);
      font-weight: 820;
    }

    .button.ghost {
      color: var(--ink);
      background: var(--control);
      border: 1px solid var(--line);
    }

    .button.danger {
      color: var(--red);
      background: transparent;
      border: 1px solid rgba(255, 71, 119, 0.7);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      padding: 11px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.05);
    }

    .stat strong {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }

    .storage-track {
      position: relative;
      height: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    .storage-used,
    .storage-project {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      border-radius: 999px;
    }

    .storage-used {
      width: 24%;
      background: rgba(37, 224, 163, 0.52);
    }

    .storage-project {
      left: 16%;
      width: 4%;
      background: var(--cyan);
    }

    .project-card {
      display: grid;
      grid-template-columns: 12px 1fr auto auto auto;
      align-items: center;
      gap: 10px;
      padding: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
    }

    .dot.green {
      background: var(--green);
    }

    .receiver-strip {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 10px 8px 10px 12px;
      border-radius: 14px;
      background: rgba(20, 18, 35, 0.96);
      border: 1px solid #304254;
    }

    .filter-row,
    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar,
    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .photo-tile {
      position: relative;
      min-height: 122px;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(6, 31, 43, 0.88);
    }

    .photo-tile.selected {
      border-color: var(--cyan);
      box-shadow: inset 0 0 0 1px var(--cyan);
    }

    .photo-img {
      width: 100%;
      height: 78px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #153c45, #08151d);
    }

    .photo-img.tall {
      object-fit: cover;
      object-position: center;
    }

    .badge-top {
      position: absolute;
      top: 8px;
      left: 8px;
      min-width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #c9a9ff;
      background: rgba(64, 34, 117, 0.86);
      border: 1px solid rgba(154, 101, 255, 0.55);
      font-size: 12px;
      font-weight: 850;
    }

    .badge-risk,
    .badge-score,
    .badge-format {
      position: absolute;
      right: 8px;
      top: 8px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
    }

    .badge-risk {
      color: var(--red);
      background: rgba(255, 71, 119, 0.15);
      border: 1px solid rgba(255, 71, 119, 0.6);
    }

    .badge-score {
      color: var(--yellow);
      background: rgba(246, 212, 0, 0.12);
      border: 1px solid rgba(246, 212, 0, 0.6);
    }

    .badge-format {
      top: auto;
      right: auto;
      bottom: 8px;
      left: 8px;
      color: var(--purple);
      background: rgba(154, 101, 255, 0.13);
      border: 1px solid rgba(154, 101, 255, 0.55);
    }

    .selection-bar {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 88px;
      z-index: 12;
      padding: 12px;
      border-radius: 18px;
      background: rgba(6, 31, 43, 0.98);
      border: 1px solid rgba(8, 212, 246, 0.55);
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .small-action {
      min-height: 44px;
      border-radius: 10px;
      color: var(--cyan);
      background: var(--control);
      border: 1px solid rgba(8, 212, 246, 0.35);
      font-size: 12px;
      font-weight: 800;
    }

    .small-action.disabled {
      color: var(--soft);
      border-color: var(--line);
      opacity: 0.62;
    }

    .receiver-card {
      min-height: 532px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(6, 31, 43, 0.9);
      border: 1px solid var(--line);
    }

    .launch-header {
      position: relative;
      height: 36px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .hero-button {
      display: grid;
      place-items: center;
      width: 142px;
      height: 142px;
      margin: 20px auto 12px;
      border-radius: 50%;
      color: #00232a;
      background: var(--cyan);
      font-size: 26px;
      font-weight: 900;
    }

    .hero-button.stop {
      background: #ff4777;
      color: #24000a;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
    }

    .segment {
      height: 43px;
      border-radius: 12px;
      color: #001b22;
      background: var(--cyan);
      font-weight: 850;
    }

    .segment.disabled {
      color: #8799a2;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--line);
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .field input,
    .field textarea {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #061923;
      color: var(--ink);
      padding: 12px;
    }

    .field input:disabled {
      color: var(--soft);
      background: rgba(255, 255, 255, 0.04);
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      align-items: end;
      padding: 16px 16px 92px;
      background: rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(3px);
    }

    .burst-modal {
      max-height: 72vh;
      overflow: auto;
      padding: 16px;
      border-radius: 18px;
      background: #071e28;
      border: 1px solid var(--line);
    }

    .burst-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .detail-photo-wrap {
      position: relative;
      width: 100%;
      margin: 4px 0 12px;
      overflow: visible;
    }

    .detail-photo {
      width: calc(100% - 26px);
      max-height: 420px;
      margin: 0 auto;
      display: block;
      border-radius: 14px;
      object-fit: contain;
      background: transparent;
    }

    .detail-photo.landscape {
      height: 224px;
      object-fit: cover;
    }

    .peek-next {
      position: absolute;
      top: 18px;
      right: -5px;
      width: 32px;
      height: calc(100% - 36px);
      border-radius: 16px;
      overflow: hidden;
      opacity: 0.5;
      filter: blur(0.2px);
      box-shadow: -12px 0 24px rgba(0, 0, 0, 0.4);
    }

    .peek-next img {
      width: 118px;
      height: 100%;
      object-fit: cover;
      transform: translateX(-54px);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 10px 0 14px;
    }

    .action-round {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--cyan);
      background: rgba(8, 212, 246, 0.08);
      border: 1px solid rgba(8, 212, 246, 0.46);
    }

    .action-round.green {
      color: var(--green);
      background: rgba(37, 224, 163, 0.08);
      border-color: rgba(37, 224, 163, 0.46);
    }

    .action-round.yellow {
      color: var(--yellow);
      background: rgba(246, 212, 0, 0.08);
      border-color: rgba(246, 212, 0, 0.46);
    }

    .action-round.red {
      color: var(--red);
      background: rgba(255, 71, 119, 0.08);
      border-color: rgba(255, 71, 119, 0.46);
    }

    .smart-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(6, 31, 43, 0.9);
    }

    .score-bubble {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      color: var(--red);
      border: 1px solid rgba(255, 71, 119, 0.6);
      background: rgba(255, 71, 119, 0.13);
      font-weight: 900;
      line-height: 1.05;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13px;
    }

    .menu-row {
      min-height: 64px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(36, 68, 84, 0.55);
    }

    .menu-row:last-child {
      border-bottom: 0;
    }

    .switch {
      width: 50px;
      height: 30px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.13);
    }

    .switch::before {
      content: "";
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #6b7d87;
    }

    .switch.on {
      background: var(--cyan);
    }

    .switch.on::before {
      margin-left: 20px;
      background: #001b22;
    }

    .slider {
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan) var(--value), rgba(255, 255, 255, 0.10) var(--value));
      position: relative;
      margin: 9px 0 5px;
    }

    .slider::after {
      content: "";
      position: absolute;
      left: var(--value);
      top: 50%;
      width: 4px;
      height: 22px;
      margin-top: -11px;
      border-radius: 999px;
      background: var(--cyan);
    }

    .prompt-package {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(6, 31, 43, 0.9);
    }

    .prompt-head {
      padding: 13px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(36, 68, 84, 0.72);
    }

    .markdown-preview {
      min-height: 180px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #051b25;
      color: var(--ink);
      line-height: 1.55;
      font-size: 14px;
    }

    .shot-panel h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .shot-panel ul {
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .shot-tag {
      display: inline-flex;
      margin: 10px 6px 0 0;
      padding: 5px 9px;
      color: var(--cyan);
      border: 1px solid rgba(8, 212, 246, 0.35);
      border-radius: 999px;
      background: rgba(8, 212, 246, 0.08);
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 1120px) {
      body {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .phone {
        justify-self: center;
      }

      .brief,
      .shot-panel {
        max-height: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <aside class="brief">
    <h1>Camera Connector 当前 HTML 原型</h1>
    <p>用于录制介绍视频的可点击原型。左侧选择镜头，右侧手机界面切换到对应页面。原型强调当前产品结构：项目管理、项目内接收、照片列表、连拍优选、模型评价和全局配置。</p>

    <div class="route-group">
      <div class="route-title">视频主线</div>
      <div class="route-list">

    const screens = {
      projects: screenProjects,
      photos: screenPhotos,
      receiver: screenReceiver,
      burst: screenBurst,
      detail: screenDetail,
      "project-ai": screenProjectAi,
      "ai-model": screenAiModel,
      "ai-workflow": screenAiWorkflow,
      "ai-threshold": screenAiThreshold,
      "ai-prompt": screenAiPrompt,

      providers: screenProviders,
      "provider-edit": screenProviderEdit,
      prompts: screenPrompts,
      "prompt-edit": screenPromptEdit,
      diagnostics: screenDiagnostics,
    };

    function setRoute(route, syncHash = true) {
      currentRoute = route;
      if (syncHash && location.hash.slice(1) !== route) {
        history.replaceState(null, "", `#${route}`);
      }
      document.querySelectorAll(".route").forEach(btn => btn.classList.toggle("active", btn.dataset.route === route));
      const note = shotNotes[route] || shotNotes.projects;
      document.getElementById("shotPanel").innerHTML = `
        <h2>${note.title}</h2>
        <p>${note.body}</p>
        <ul>
          <li>录制时先停留 1 秒，让观众看清页面结构。</li>
          <li>重点拍摄当前页面的主操作和状态变化。</li>
          <li>不需要解释工程实现，旁白只讲用户能感知的价值。</li>
        </ul>
        ${(note.tags || []).map(tag => `<span class="shot-tag">${tag}</span>`).join("")}
      `;
      (screens[route] || screenProjects)();
    }

    document.addEventListener("click", event => {
      const routeTarget = event.target.closest("[data-route]");
      if (routeTarget) {
        event.preventDefault();
        setRoute(routeTarget.dataset.route);
        return;
      }
      const actionTarget = event.target.closest("[data-action]");
      if (actionTarget?.dataset.action === "toggleReceiver") {
        receiverRunning = !receiverRunning;
        setRoute("receiver");
      }
    });

    window.addEventListener("hashchange", () => {
      const route = location.hash.slice(1);
      if (screens[route]) {
        setRoute(route, false);
      }
    });

    setRoute(screens[location.hash.slice(1)] ? location.hash.slice(1) : "projects", false);
  </script>
